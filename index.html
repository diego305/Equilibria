<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equilibria - Test de Buenos Hábitos Saludables</title>
    <meta name="description" content="Evaluador interactivo de bienestar en los cuatro pilares fundamentales: sueño, alimentación, salud mental y ejercicio físico. Incluye comparativas visuales, historial local, modo oscuro automático y reporte en PDF." />
    <meta property="og:title" content="Equilibria - Test de Buenos Hábitos Saludables" />
    <meta property="og:description" content="Mide tus hábitos de sueño, alimentación, mente y ejercicio con recomendaciones y gráficas de progreso." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('equilibria_theme_preference');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var hour = new Date().getHours();
          var isNight = hour >= 20 || hour < 7;
          var shouldBeDark = saved === 'dark' || (saved !== 'light' && (prefersDark || isNight));
          if (shouldBeDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.removeAttribute('data-theme');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900 dark:selection:bg-emerald-950/60 dark:selection:text-emerald-200 bg-[#F8FAF9] dark:bg-[#0c1412] text-stone-800 dark:text-stone-100 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
